name: release

# Patch-bump and publish to Clojars only when the push changes the library.
# README / CI / test-only commits do not mint a version, because a published
# pom is immutable.
#
# Secrets (per-repo or hive-agi org-wide): CLOJARS_USERNAME, CLOJARS_DEPLOY_TOKEN.
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'resources/**'
      - 'deps.edn'
      # The suite gates the bump/deploy below, so a test-only change MUST be
      # able to trigger a run: excluded here, a test fix can never be validated
      # and a test-only regression stays invisible until an unrelated src push
      # trips over it.
      - 'test/**'
      - 'tests.edn'
      # Include the workflow itself so a change to the release pipeline is
      # exercised by the very push that makes it.
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      # Licence gate. LICENSE, version.edn :license and the src SPDX headers
      # must agree, and a published pom can never be retracted, so drift has to
      # stop the run rather than scroll past as a warning. `:strict true` throws
      # on hive-build >= the release that added it; the grep keeps an older
      # pinned hive-build (which ignores :strict and only warns) failing too.
      - name: Verify licence
        run: |
          set -euo pipefail
          out=$(clojure -T:build verify-license :strict true 2>&1) || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'WARNING: license inconsistency'; then
            echo "::error::licence drift: LICENSE, version.edn and SPDX headers disagree"
            exit 1
          fi

      # Gate BEFORE the bump: a published pom is immutable, so a red suite
      # must not be able to mint a version, tag it and ship it.
      - name: Test
        run: |
          if [ -d test ]; then
            clojure -M:test
          else
            echo "no test/ directory — nothing to gate on"
          fi

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Commit and tag
        run: |
          set -euo pipefail
          VER=$(cat VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git add VERSION
          # [skip ci] stops this push from retriggering the workflow.
          git commit -m "chore(release): $VER [skip ci]"
          # --atomic: branch and tag land together or not at all, so a rejected
          # branch push cannot leave an orphan tag that fails every later release.
          # Annotated: `git push --follow-tags` ignores lightweight tags,
          # which would publish the artifact and silently drop the tag.
          git tag -a "v$VER" -m "release $VER"
          git push --atomic --follow-tags

      - name: Deploy
        env:
          # deps-deploy and hive-build both read CLOJARS_PASSWORD; the org
          # secret is CLOJARS_DEPLOY_TOKEN. Map one onto the other.
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
